name: TrueNAS Proxy
version: 2.2
panel_icon: "mdi:nas"
panel_title: TrueNAS
slug: truenas-proxy
description: Proxy addon for the TrueNAS SCALE local web UI
url: "https://github.com/truenas/webui"
startup: application
boot: auto
init: false
ingress: true
ingress_port: 5000
ingress_entry: /
panel_admin: true
host_network: false
devices: []
usb: false
tmpfs: false
full_access: false
environment: {}
options:
  server: "https://truenas.local:443"
  proxy_pass_host: false
  proxy_pass_real_ip: true
  verify_ssl: false
  rewrite_paths: true
schema:
  server: "match(^https?://.+:\\d+$)"
  proxy_pass_host: bool
  proxy_pass_real_ip: bool
  verify_ssl: bool
  rewrite_paths: bool
services: []
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
map: []
